[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grbl-pen-plotter"
version = "0.1.1"
description = "CLI sender and toolpath tools for GRBL pen plotters (JinGan / BtWriter class)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Nikita Esipov" }]
keywords = ["grbl", "pen-plotter", "gcode", "cnc", "handwriting", "svg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "pyserial>=3.5,<4",
  "tomli>=2.0.1; python_version < '3.11'",
  "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
penplot = "grbl_pen_plotter.cli:main"

[project.urls]
Homepage = "https://github.com/NikEdtech/grbl-pen-plotter"
Repository = "https://github.com/NikEdtech/grbl-pen-plotter"
Issues = "https://github.com/NikEdtech/grbl-pen-plotter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grbl_pen_plotter = ["py.typed", "data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
